<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Матрица цен Apple Resell</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-color: #0A84FF;
      --accent-glow: rgba(10, 132, 255, 0.35);
      --text-main: #FFFFFF;
      --text-muted: #8E8E93;
      --success-color: #30D158;
      --danger-color: #FF453A;
      --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-family);
      padding: 16px;
      padding-bottom: 90px;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      margin-bottom: 20px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Селектор серий */
    .series-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .series-bar::-webkit-scrollbar { display: none; }

    .series-pill {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .series-pill.active {
      background: var(--accent-color);
      color: #fff;
      box-shadow: 0 0 12px var(--accent-glow);
      border-color: var(--accent-color);
    }

    /* Карточки моделей */
    .models-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .model-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.15s ease, border-color 0.2s ease;
    }
    .model-card:active {
      transform: scale(0.99);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: rgba(255, 255, 255, 0.15);
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: var(--success-color);
    }
    input:checked + .slider:before {
      transform: translateX(20px);
    }

    .card-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .price-input-wrapper {
      position: relative;
      flex: 1;
    }

    .price-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 8px 30px 8px 12px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      outline: none;
      transition: border-color 0.2s;
    }
    .price-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 8px var(--accent-glow);
    }
    .price-currency {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-weight: 600;
      font-size: 14px;
    }

    /* Кнопка сохранения внизу */
    .save-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      gap: 10px;
    }

    .btn-save {
      flex: 1;
      background: var(--accent-color);
      color: #fff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px var(--accent-glow);
      transition: transform 0.1s ease, filter 0.2s;
    }
    .btn-save:active {
      transform: scale(0.98);
      filter: brightness(0.9);
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>📱 Матрица выкупа Apple</h1>
    <p>Настройте максимальные цены выкупа и активные модели на лету.</p>
  </div>

  <div class="series-bar" id="seriesBar">
    <div class="series-pill active" data-series="all">Все серии</div>
    <div class="series-pill" data-series="16">iPhone 16</div>
    <div class="series-pill" data-series="15">iPhone 15</div>
    <div class="series-pill" data-series="14">iPhone 14</div>
    <div class="series-pill" data-series="13">iPhone 13</div>
    <div class="series-pill" data-series="12">iPhone 12</div>
    <div class="series-pill" data-series="11">iPhone 11</div>
  </div>

  <div class="models-list" id="modelsList">
    <!-- Генерируется динамически через JS -->
  </div>

  <div class="save-bar">
    <button class="btn-save" id="btnSave">💾 Применить цены в бота</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      if (tg.setHeaderColor) tg.setHeaderColor('#0b0f19');
      if (tg.setBackgroundColor) tg.setBackgroundColor('#0b0f19');
    }

    // Исходная база моделей
    let currentMatrix = [
      { key: "iPhone 16 Pro Max_256", model: "iPhone 16 Pro Max", storage: 256, series: "16", price: 105000, enabled: true },
      { key: "iPhone 16 Pro_128", model: "iPhone 16 Pro", storage: 128, series: "16", price: 88000, enabled: true },
      { key: "iPhone 16_128", model: "iPhone 16", storage: 128, series: "16", price: 68000, enabled: true },
      { key: "iPhone 15 Pro Max_256", model: "iPhone 15 Pro Max", storage: 256, series: "15", price: 82000, enabled: true },
      { key: "iPhone 15 Pro_128", model: "iPhone 15 Pro", storage: 128, series: "15", price: 65000, enabled: true },
      { key: "iPhone 15_128", model: "iPhone 15", storage: 128, series: "15", price: 50000, enabled: true },
      { key: "iPhone 14 Pro Max_128", model: "iPhone 14 Pro Max", storage: 128, series: "14", price: 58000, enabled: true },
      { key: "iPhone 14 Pro_128", model: "iPhone 14 Pro", storage: 128, series: "14", price: 50000, enabled: true },
      { key: "iPhone 14_128", model: "iPhone 14", storage: 128, series: "14", price: 40000, enabled: true },
      { key: "iPhone 13 Pro Max_128", model: "iPhone 13 Pro Max", storage: 128, series: "13", price: 46000, enabled: true },
      { key: "iPhone 13 Pro_128", model: "iPhone 13 Pro", storage: 128, series: "13", price: 38000, enabled: true },
      { key: "iPhone 13_128", model: "iPhone 13", storage: 128, series: "13", price: 32000, enabled: true },
      { key: "iPhone 12 Pro Max_128", model: "iPhone 12 Pro Max", storage: 128, series: "12", price: 35000, enabled: true },
      { key: "iPhone 12 Pro_128", model: "iPhone 12 Pro", storage: 128, series: "12", price: 28000, enabled: true },
      { key: "iPhone 12_128", model: "iPhone 12", storage: 128, series: "12", price: 23000, enabled: true },
      { key: "iPhone 11_128", model: "iPhone 11", storage: 128, series: "11", price: 16000, enabled: true },
    ];

    let activeFilter = 'all';

    function renderCards() {
      const container = document.getElementById('modelsList');
      container.innerHTML = '';

      const filtered = activeFilter === 'all' 
        ? currentMatrix 
        : currentMatrix.filter(m => m.series === activeFilter);

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'model-card';
        card.innerHTML = `
          <div class="card-top">
            <span class="card-title">${item.model} ${item.storage}GB</span>
            <label class="switch">
              <input type="checkbox" ${item.enabled ? 'checked' : ''} data-key="${item.key}">
              <span class="slider"></span>
            </label>
          </div>
          <div class="card-bottom">
            <div class="price-input-wrapper">
              <input type="number" step="500" class="price-input" value="${item.price}" data-key="${item.key}">
              <span class="price-currency">₽</span>
            </div>
          </div>
        `;

        // Слушатель чекбокса
        card.querySelector('input[type="checkbox"]').addEventListener('change', (e) => {
          if (tg?.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
          const target = currentMatrix.find(m => m.key === e.target.dataset.key);
          if (target) target.enabled = e.target.checked;
        });

        // Слушатель цены
        card.querySelector('input[type="number"]').addEventListener('input', (e) => {
          const target = currentMatrix.find(m => m.key === e.target.dataset.key);
          if (target) target.price = parseInt(e.target.value, 10) || 0;
        });

        container.appendChild(card);
      });
    }

    // Фильтр по сериям
    document.querySelectorAll('.series-pill').forEach(pill => {
      pill.addEventListener('click', () => {
        if (tg?.HapticFeedback) tg.HapticFeedback.selectionChanged();
        document.querySelectorAll('.series-pill').forEach(p => p.classList.remove('active'));
        pill.classList.add('active');
        activeFilter = pill.dataset.series;
        renderCards();
      });
    });

    // Сохранение и отправка данных в бота
    document.getElementById('btnSave').addEventListener('click', () => {
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
      
      const payload = {
        action: "update_matrix",
        matrix: currentMatrix
      };

      if (tg) {
        tg.sendData(JSON.stringify(payload));
      } else {
        alert("Изменения сохранены! В Telegram эти данные мгновенно передадутся боту.");
      }
    });

    renderCards();
  </script>
</body>
</html>
