version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: apple_radar_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  bot:
    build: .
    container_name: apple_radar_bot
    restart: always
    depends_on:
      - redis
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./pricing_matrix.json:/app/pricing_matrix.json
      - ./proxies.txt:/app/proxies.txt

volumes:
  redis_data:
